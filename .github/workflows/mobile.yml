# Dentist app: format, analysis and tests on every change (the preview workflow builds the web preview on main).
name: Mobile

on:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.1
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      # test/ only: test_live/ needs a running API and is run on purpose.
      - run: flutter test test

  # The release build (flavors, signing fallback, R8/obfuscation) compiles on Android. Signed with the debug key here;
  # store builds use the upload key (mobile/README.md "Release builds").
  android-release:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.1
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build the production app bundle
        run: API_BASE_URL=https://api.example.invalid tool/build_release.sh prod appbundle
      - name: Build the staging APK
        run: API_BASE_URL=https://api-staging.example.invalid tool/build_release.sh staging apk
      - run: ls -la build/app/outputs/bundle/prodRelease build/app/outputs/flutter-apk
