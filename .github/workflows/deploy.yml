# Build and deploy (PROJECT1_PLAN.md §8.4). Images go to GHCR, tagged with the commit SHA.
#   push to main  -> build the API and ai-svc images -> deploy to staging
#   tag v*        -> the same images -> deploy to production after approval (GitHub environment `production`)
# Until the VPS exists, the deploy jobs build the edge image and stop before SSH (no DEPLOY_HOST secret yet).
name: Deploy

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: backend
          - name: ai
            context: ai
    steps:
      - uses: actions/checkout@v4
      # The ai-svc image carries ~5 GB of model weights; make room on the runner.
      - name: Free disk space
        if: matrix.name == 'ai'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/dentlegal-${{ matrix.name }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: prod
          push: true
          tags: ${{ steps.name.outputs.image }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ steps.name.outputs.image }}:buildcache
          cache-to: type=registry,ref=${{ steps.name.outputs.image }}:buildcache,mode=max

  staging:
    if: github.ref == 'refs/heads/main'
    needs: images
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: staging
    secrets: inherit

  production:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: images
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: production
    secrets: inherit
