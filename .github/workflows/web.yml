# Web dashboard and marketing site: types, tests and a full static build on every change
# (the preview workflow deploys from main).
name: Web

on:
  push:
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web.yml"

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm site:build
      # After the builds: the site tests read the pre-rendered HTML.
      - run: pnpm test
      # Dashboard smoke test (S9.4) on the generated build with the fake API: sign-in + 2FA → claim → edit → approve,
      # and every admin page. The same test runs against staging with E2E_BASE_URL (dashboard/e2e/README.md).
      - run: pnpm --filter @dentlegal/dashboard exec playwright install --with-deps chromium
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-smoke-report
          path: web/dashboard/playwright-report
          retention-days: 7
