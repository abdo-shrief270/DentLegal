name: dentlegal
description: "DentLegal dentist app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  dio: ^5.11.1
  file_picker: ^13.4.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  freezed_annotation: ^3.1.0
  go_router: ^18.1.4
  hijri: ^3.0.1
  image_picker: ^1.2.4
  intl: ^0.20.3
  local_auth: ^3.0.2
  lucide_icons_flutter: ^4.0.3
  material_ui: ^1.1.0
  pdfrx: ^3.1.0
  riverpod_annotation: ^4.0.8
  screen_protector: ^1.5.3
  sentry_flutter: ^10.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.17.1
  riverpod_generator: ^4.0.10
  freezed: ^4.0.3
  riverpod_lint: ^3.2.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/OFL.txt
  fonts:
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700

