; Production PHP settings for the API image.
expose_php = Off
memory_limit = 256M
; Uploads: case documents up to 20 MB (S3.2), knowledge-source PDFs up to 50 MB (S1.5).
upload_max_filesize = 55M
post_max_size = 60M
max_execution_time = 120
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
