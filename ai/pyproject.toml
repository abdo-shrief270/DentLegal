[project]
name = "dentlegal-ai-svc"
version = "0.1.0"
description = "DentLegal AI service: Arabic normalisation, PII masking, hybrid retrieval over Saudi regulations, Claude routes with citation verification."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165",
    "uvicorn[standard]>=0.54",
    "pydantic>=2.14",
    "pydantic-settings>=2.6",
    "psycopg[binary,pool]>=3.3",
    "pgvector>=0.5",
    "numpy>=2.0",
    "anthropic>=2.12,<3",
    "structlog>=26.1",
    "rapidfuzz>=3.14",
    "pyyaml>=6.0",
    "pypdfium2>=5.0",
    "pillow>=11.0",
    "pytesseract>=0.3.13",
    "python-multipart>=0.0.20",
    "sentry-sdk>=2.42,<3",
]

[project.optional-dependencies]
# Self-hosted models (PROJECT1_PLAN.md §5.4). Installed in the production image, not needed for tests.
models = [
    "FlagEmbedding>=1.3",
    "camel-tools>=1.5",
]
dev = [
    "pytest>=9.0",
    "ruff>=0.17",
    "mypy>=2.4",
    "types-PyYAML",
    "pip-audit>=2.9",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Arabic text uses characters ruff mistakes for confusables

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "E501"]
"app/llm/prompts.py" = ["E501"]  # prompt prose

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
