# Production and staging stack on the Hostinger VPS (PROJECT1_PLAN.md §8.3). Lives in /srv/dentlegal next to:
#   .env      compose settings: REGISTRY, IMAGE_TAG, hosts, Postgres and Redis passwords (see env/compose.env.example)
#   app.env   Laravel settings (env/app.env.example)
#   ai.env    ai-svc settings (env/ai.env.example)
# All three are mode 600, owned by `deploy`, and never in git. The deploy workflow copies this file and deploy.sh.
name: dentlegal

x-app: &app
  image: ${REGISTRY:?}/dentlegal-api:${IMAGE_TAG:?}
  restart: unless-stopped
  env_file: [app.env]
  environment:
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_DATABASE: dentlegal
    DB_USERNAME: dentlegal
    DB_PASSWORD: ${POSTGRES_APP_PASSWORD:?}
    REDIS_HOST: redis
    REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    AI_SERVICE_URL: http://ai:8000
    DOCUMENTS_ROOT: /srv/documents
    # Only Caddy, on this network, may set X-Forwarded-For (rate limits and HSTS see the real client).
    TRUSTED_PROXIES: 172.30.0.0/24
  volumes:
    - ./documents:/srv/documents
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  caddy:
    image: ${REGISTRY:?}/dentlegal-web:${WEB_TAG:-${IMAGE_TAG:?}}
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      API_HOST: ${API_HOST:?}
      PORTAL_HOST: ${PORTAL_HOST:?}
      SITE_HOST: ${SITE_HOST:?}
      ACME_EMAIL: ${ACME_EMAIL:?}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app: { condition: service_healthy }

  app:
    <<: *app

  horizon:
    <<: *app
    command: ["php", "artisan", "horizon"]
    healthcheck: { disable: true }
    depends_on:
      app: { condition: service_healthy }

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    healthcheck: { disable: true }
    depends_on:
      app: { condition: service_healthy }

  ai:
    image: ${REGISTRY:?}/dentlegal-ai:${IMAGE_TAG:?}
    restart: unless-stopped
    env_file: [ai.env]
    environment:
      AI_DATABASE_URL: postgresql://dentlegal:${POSTGRES_APP_PASSWORD:?}@postgres:5432/dentlegal
    depends_on:
      postgres: { condition: service_healthy }

  postgres:
    image: pgvector/pgvector:0.8.1-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?}
    # Loopback only (never reachable from outside): the backup and restore scripts in infra/ops run on the host.
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dentlegal"]
      interval: 5s
      retries: 30

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?}", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
