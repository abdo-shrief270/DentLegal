# Local development stack (PROJECT1_PLAN.md S0.1): `make up`, then the API on http://localhost:8000, ai-svc on :8001,
# Mailpit on :8025. Synthetic data only. Production uses infra/ (S0.3–S0.5), not this file.
name: dentlegal

x-backend: &backend
  build: { context: ./backend, target: dev }
  volumes: ["./backend:/app"]
  # Optional: the entrypoint creates backend/.env from .env.example on first start; the values below win.
  env_file: [{ path: ./backend/.env, required: false }]
  environment: &backend-env
    APP_ENV: local
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_DATABASE: dentlegal
    DB_USERNAME: dentlegal
    DB_PASSWORD: dentlegal
    REDIS_HOST: redis
    QUEUE_CONNECTION: redis
    QUEUE_LONG_CONNECTION: redis-long
    SESSION_DRIVER: redis
    CACHE_STORE: redis
    MAIL_MAILER: smtp
    MAIL_HOST: mailpit
    MAIL_PORT: "1025"
    SMS_DRIVER: log
    PUSH_DRIVER: log
    AI_SERVICE_URL: http://ai:8000
    AI_SERVICE_TOKEN: dev-service-token
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg17
    environment:
      POSTGRES_USER: dentlegal
      POSTGRES_PASSWORD: dentlegal
      POSTGRES_DB: dentlegal
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/dev/postgres-init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dentlegal -d dentlegal"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["8025:8025"]

  api:
    <<: *backend
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"]
      interval: 10s
      start_period: 60s
      retries: 10

  # Queues (default, ai, ingest) through Horizon, as in production.
  horizon:
    <<: *backend
    command: ["php", "artisan", "horizon"]
    depends_on:
      api: { condition: service_healthy }

  # The nightly stats roll-up and retention job.
  scheduler:
    <<: *backend
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      api: { condition: service_healthy }

  ai:
    build: { context: ./ai, target: dev }
    volumes: ["./ai/app:/srv/ai/app", "./ai/config:/srv/ai/config"]
    environment:
      AI_ENV: local
      AI_SERVICE_TOKEN: dev-service-token
      AI_MASKING_SECRET: dev-masking-secret
      AI_DATABASE_URL: postgresql://dentlegal:dentlegal@postgres:5432/dentlegal
      AI_EMBEDDER: hashing
      AI_RERANKER: lexical
      AI_NER: none
      AI_INFERENCE_GEO: us
      # Set in your shell to try real Claude calls with synthetic data: ANTHROPIC_API_KEY=… make up
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports: ["8001:8000"]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health', timeout=4)"]
      interval: 10s
      start_period: 30s
      retries: 10

volumes:
  pgdata:
